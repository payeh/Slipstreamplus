name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Check prerelease
        id: check_prerelease
        run: |
          if [[ "${{ steps.get_version.outputs.version }}" == *"dev"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-windows:
    runs-on: windows-latest
    needs: detect-version
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 websocket-client pyinstaller

      - name: Download Core Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (!(Test-Path "bin")) { mkdir bin }
          # Download Slipstream Client
          gh release download -R Fox-Fig/slipstream-rust-plus-deploy -p "slipstream-client-windows-amd64.exe" -D bin --clobber
          
          # Download Sing-box
          gh release download -R SagerNet/sing-box -p "*windows-amd64.zip" --clobber
          7z x sing-box-*-windows-amd64.zip -o"." -y
          Move-Item -Path sing-box-*-windows-amd64/sing-box.exe -Destination bin/sing-box.exe -Force

          # Download DNSTT client
          Invoke-WebRequest -Uri "https://dnstt.network/dnstt-client-windows-amd64.exe" -OutFile "bin/dnstt-client-windows-amd64.exe"

          # Download Wintun (for TUN mode)
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Force "wintun.zip" "wintun-tmp"
          $wintun = Get-ChildItem -Path "wintun-tmp" -Recurse -Filter "wintun.dll" | Where-Object { $_.FullName -match \"amd64\" } | Select-Object -First 1
          if ($wintun) { Copy-Item -Force $wintun.FullName \"bin/wintun.dll\" }
          Remove-Item -Force \"wintun.zip\"
          Remove-Item -Recurse -Force \"wintun-tmp\"
          
          dir bin

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean `
            --onedir --windowed --name "SlipstreamPlus-Windows" `
            --icon=icon.ico `
            Slipstreamplus.py

      - name: Stage Runtime Folders Next To EXE
        run: |
          $outDir = \"dist\\SlipstreamPlus-Windows\"
          Copy-Item -Recurse -Force \"bin\" $outDir
          Copy-Item -Recurse -Force \"asset\" $outDir
          Copy-Item -Recurse -Force \"geo\" $outDir
          Copy-Item -Recurse -Force \"cidrs\" $outDir
          Copy-Item -Force \"icon.ico\" $outDir
          Copy-Item -Force \"README.md\" $outDir
          Copy-Item -Force \"README-fa.md\" $outDir
          if (Test-Path \"screen.jpg\") { Copy-Item -Force \"screen.jpg\" $outDir }

      - name: Package (ZIP)
        run: |
          $tag = \"${{ github.ref_name }}\"
          $zipName = \"SlipstreamPlus-$tag-windows-amd64.zip\"
          if (Test-Path $zipName) { Remove-Item -Force $zipName }
          Compress-Archive -Path \"dist\\SlipstreamPlus-Windows\\*\" -DestinationPath $zipName

      - name: Export Extra Release Assets
        run: |
          $tag = \"${{ github.ref_name }}\"
          Copy-Item -Force \"bin\\dnstt-client-windows-amd64.exe\" \"dnstt-client-$tag-windows-amd64.exe\"
          Copy-Item -Force \"bin\\wintun.dll\" \"wintun-$tag-windows-amd64.dll\"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlipstreamPlus-Windows
          path: |
            SlipstreamPlus-${{ github.ref_name }}-windows-amd64.zip
            dnstt-client-${{ github.ref_name }}-windows-amd64.exe
            wintun-${{ github.ref_name }}-windows-amd64.dll

  build-linux:
    runs-on: ubuntu-latest
    needs: detect-version
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 websocket-client pyinstaller

      - name: Download Core Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin
          # Download Slipstream Client
          gh release download -R Fox-Fig/slipstream-rust-plus-deploy -p "slipstream-client-linux-amd64" -D bin --clobber
          chmod +x bin/slipstream-client-linux-amd64
          
          # Download Sing-box
          gh release download -R SagerNet/sing-box -p "*linux-amd64.tar.gz" --clobber
          tar -xzf sing-box-*-linux-amd64.tar.gz
          mv sing-box-*-linux-amd64/sing-box bin/sing-box
          chmod +x bin/sing-box
          
          ls -l bin/

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean \
            --onedir --windowed --name "SlipstreamPlus-Linux" \
            Slipstreamplus.py

      - name: Stage Runtime Folders Next To Binary
        run: |
          out_dir="dist/SlipstreamPlus-Linux"
          cp -rf bin "$out_dir/"
          cp -rf asset "$out_dir/"
          cp -rf geo "$out_dir/"
          cp -rf cidrs "$out_dir/"
          cp -f README.md "$out_dir/"
          cp -f README-fa.md "$out_dir/"
          test -f screen.jpg && cp -f screen.jpg "$out_dir/" || true

      - name: Package (ZIP)
        run: |
          cd dist
          zip -r "../SlipstreamPlus-${{ github.ref_name }}-linux-amd64.zip" SlipstreamPlus-Linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlipstreamPlus-Linux
          path: SlipstreamPlus-${{ github.ref_name }}-linux-amd64.zip

  release:
    runs-on: ubuntu-latest
    needs: [detect-version, build-windows, build-linux]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Delete Existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ github.ref_name }} --yes || echo "No release to delete"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SlipstreamPlus-Windows/SlipstreamPlus-${{ github.ref_name }}-windows-amd64.zip
            artifacts/SlipstreamPlus-Windows/dnstt-client-${{ github.ref_name }}-windows-amd64.exe
            artifacts/SlipstreamPlus-Windows/wintun-${{ github.ref_name }}-windows-amd64.dll
            artifacts/SlipstreamPlus-Linux/SlipstreamPlus-${{ github.ref_name }}-linux-amd64.zip
          prerelease: ${{ needs.detect-version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          append_body: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          fail_on_unmatched_files: true
